name: Automated Spring Boot migration

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Target base branch for the PR'
        required: true
        default: 'develop'

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "repo-automation"
          git config user.email "automation@example.com"

      - name: Prepare branch
        run: |
          set -eux
          BASE="${{ github.event.inputs.base_branch }}"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if git show-ref --verify --quiet refs/heads/modernize/spring-boot; then
            git checkout modernize/spring-boot
          else
            if git rev-parse --verify --quiet "origin/${BASE}"; then
              git checkout -b modernize/spring-boot "origin/${BASE}"
            elif git rev-parse --verify --quiet "${BASE}"; then
              git checkout -b modernize/spring-boot "${BASE}"
            else
              echo "Base branch '${BASE}' not found; creating modernize/spring-boot from current HEAD"
              git checkout -b modernize/spring-boot
            fi
          fi

      - name: Write migration files
        run: |
          set -euo pipefail
          mkdir -p biometric-application/src/main/java/com/siddhrans/biometric/service
          mkdir -p biometric-application/src/main/resources
          mkdir -p .github/workflows

          cat > biometric-application/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          	xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
          	<modelVersion>4.0.0</modelVersion>

          	<parent>
          		<groupId>org.springframework.boot</groupId>
          		<artifactId>spring-boot-starter-parent</artifactId>
          		<version>3.1.6</version>
          		<relativePath/> <!-- lookup parent from repository -->
          	</parent>

          	<groupId>com.siddhrans.biometric</groupId>
          	<artifactId>biometric-application</artifactId>
          	<version>1.0.0</version>
          	<name>PAM</name>
          	<packaging>jar</packaging>

          	<properties>
          		<java.version>17</java.version>
          		<maven.compiler.release>17</maven.compiler.release>
          	</properties>

          	<dependencies>
          		<!-- Spring Boot Starters -->
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-web</artifactId>
          		</dependency>
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-data-jpa</artifactId>
          		</dependency>
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-security</artifactId>
          		</dependency>
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-validation</artifactId>
          		</dependency>
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-jdbc</artifactId>
          		</dependency>
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-thymeleaf</artifactId>
          		</dependency>

          		<!-- Flyway for migrations -->
          		<dependency>
          			<groupId>org.flywaydb</groupId>
          			<artifactId>flyway-core</artifactId>
          		</dependency>

          		<!-- OpenPDF as replacement for iText 5 -->
          		<dependency>
          			<groupId>com.github.librepdf</groupId>
          			<artifactId>openpdf</artifactId>
          			<version>1.3.30</version>
          		</dependency>

          		<!-- Apache POI for Excel parsing -->
          		<dependency>
          			<groupId>org.apache.poi</groupId>
          			<artifactId>poi-ooxml</artifactId>
          			<version>5.2.3</version>
          		</dependency>

          		<!-- FTP client -->
          		<dependency>
          			<groupId>commons-net</groupId>
          			<artifactId>commons-net</artifactId>
          			<version>3.8.0</version>
          		</dependency>

          		<!-- SFTP (SSHJ) optional for secure transfers -->
          		<dependency>
          			<groupId>com.hierynomus</groupId>
          			<artifactId>sshj</artifactId>
          			<version>0.34.0</version>
          		</dependency>

          		<!-- PostgreSQL driver (for Supabase migration later) -->
          		<dependency>
          			<groupId>org.postgresql</groupId>
          			<artifactId>postgresql</artifactId>
          			<version>42.6.0</version>
          		</dependency>

          		<!-- testing -->
          		<dependency>
          			<groupId>org.springframework.boot</groupId>
          			<artifactId>spring-boot-starter-test</artifactId>
          			<scope>test</scope>
          		</dependency>
          	</dependencies>

          	<build>
          		<plugins>
          			<plugin>
          				<groupId>org.springframework.boot</groupId>
          				<artifactId>spring-boot-maven-plugin</artifactId>
          			</plugin>
          			<plugin>
          				<groupId>org.apache.maven.plugins</groupId>
          				<artifactId>maven-compiler-plugin</artifactId>
          				<version>3.11.0</version>
          				<configuration>
          					<release>17</release>
          				</configuration>
          			</plugin>
          		</plugins>
          	</build>

          </project>
          EOF

          cat > biometric-application/src/main/java/com/siddhrans/biometric/Application.java <<'EOF'
          package com.siddhrans.biometric;

          import org.springframework.boot.SpringApplication;
          import org.springframework.boot.autoconfigure.SpringBootApplication;

          @SpringBootApplication
          public class Application {

              public static void main(String[] args) {
                  SpringApplication.run(Application.class, args);
              }

          }
          EOF

          cat > biometric-application/src/main/resources/application.yml <<'EOF'
          spring:
            datasource:
              url: ${DB_URL:jdbc:postgresql://localhost:5432/biometric}
              username: ${DB_USER:postgres}
              password: ${DB_PASSWORD:password}
              driver-class-name: org.postgresql.Driver
            jpa:
              hibernate:
                ddl-auto: validate
              properties:
                hibernate:
                  format_sql: true

          # Flyway settings (will run against datasource)
          flyway:
            enabled: true

          # FTP / SFTP configuration - keep secrets in env vars
          ftp:
            host: ${FTP_HOST:}
            port: ${FTP_PORT:21}
            user: ${FTP_USER:}
            password: ${FTP_PASSWORD:}
            remote-path: ${FTP_REMOTE_PATH:}

          # Application settings
          app:
            env: ${APP_ENV:dev}
            log-level: ${LOG_LEVEL:INFO}
          EOF

          cat > biometric-application/Dockerfile <<'EOF'
          # Build and run the Spring Boot application
          FROM maven:3.9.4-eclipse-temurin-17 as builder
          WORKDIR /workspace
          COPY biometric-application/pom.xml ./
          COPY biometric-application/src ./src
          RUN mvn -f pom.xml -DskipTests package -Pci && mv target/*.jar app.jar

          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY --from=builder /workspace/app.jar ./app.jar
          EXPOSE 8080
          ENTRYPOINT ["java","-jar","/app/app.jar"]
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [ modernize/spring-boot ]
            pull_request:
              branches: [ modernize/spring-boot ]

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - uses: actions/checkout@v4
                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - name: Build with Maven
                  working-directory: biometric-application
                  run: mvn -B -DskipTests package
                - name: Run tests
                  working-directory: biometric-application
                  run: mvn -B test
          EOF

          cat > biometric-application/src/main/java/com/siddhrans/biometric/service/FtpFetcherService.java <<'EOF'
          package com.siddhrans.biometric.service;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          import org.apache.commons.net.ftp.FTP;
          import org.apache.commons.net.ftp.FTPClient;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import org.springframework.stereotype.Service;

          @Service
          public class FtpFetcherService {

              private static final Logger logger = LoggerFactory.getLogger(FtpFetcherService.class);

              public File fetch(String host, int port, String username, String password, String remotePath) throws IOException {
                  FTPClient client = new FTPClient();
                  File tempFile = null;
                  try {
                      client.connect(host, port);
                      boolean loggedIn = client.login(username, password);
                      if (!loggedIn) {
                          throw new IOException("FTP login failed for user: " + username);
                      }

                      client.enterLocalPassiveMode();
                      client.setFileType(FTP.BINARY_FILE_TYPE);

                      String baseName = new File(remotePath).getName();
                      tempFile = File.createTempFile("biometric_" + baseName + "_", ".dat");

                      try (FileOutputStream fos = new FileOutputStream(tempFile)) {
                          boolean success = client.retrieveFile(remotePath, fos);
                          if (!success) {
                              throw new IOException("Failed to retrieve remote file: " + remotePath);
                          }
                      }

                      logger.info("FTP fetch successful: {} -> {}", remotePath, tempFile.getAbsolutePath());
                      return tempFile;
                  } finally {
                      if (client.isConnected()) {
                          try {
                              client.logout();
                              client.disconnect();
                          } catch (IOException e) {
                              logger.warn("Error while disconnecting FTP client", e);
                          }
                      }
                  }
              }
          }
          EOF

          cat > biometric-application/src/main/java/com/siddhrans/biometric/service/BiometricParsingService.java <<'EOF'
          package com.siddhrans.biometric.service;

          import java.io.File;

          import org.springframework.stereotype.Service;

          @Service
          public class BiometricParsingService {

              // TODO: Move parsing logic from controllers into this service.
              // Provide methods like:
              // - File datToCSVFile(File input)
              // - byte[] readBytesFromFile(File file)
              // - List<UserBiometricData> parse(File csvOrDatFile, int year, int month, int machineId)

              public void process(File file, Integer machineId, String year, String month) throws Exception {
                  // placeholder - implementation will port logic from BiometricDataController
              }
          }
          EOF

      - name: Commit files
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Migrate to Spring Boot (initial commit): parent pom, Application, app.yml, Dockerfile, CI, services"
          fi

      - name: Push branch using PAT
        env:
          PUSH_PAT: ${{ secrets.PUSH_PAT }} 
        run: |
          set -eux
          git remote set-url origin "https://x-access-token:${PUSH_PAT}@github.com/${{ github.repository }}.git"
          git push --set-upstream origin modernize/spring-boot

      - name: Create pull request
        run: |
          PR_TITLE="Migrate to Spring Boot (Java 17) — initial migration"
          PR_BODY="Initial Spring Boot 3 (Java 17) migration: parent pom, Application class, application.yml template, Dockerfile, CI workflow, FTP and parsing service skeleton. Follow-up PRs will port parsing logic, convert remaining UI to Thymeleaf, and add Supabase migration scripts."
          API_URL="https://api.github.com/repos/${{ github.repository }}/pulls"
          RESPONSE=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            -d "{\"title\":\"${PR_TITLE}\",\"head\":\"modernize/spring-boot\",\"base\":\"${{ github.event.inputs.base_branch }}\",\"body\":\"${PR_BODY}\"}" \
            "${API_URL}")
          echo "PR API response:"
          echo "$RESPONSE"
